<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Horizon Cooler</title>
    <style>
        :root {
            --grad-primary: linear-gradient(135deg, #00f2fe 0%, #7928ca 50%, #f72585 100%);
            --bg-deep: #0b0d17;
            --card-glass: rgba(18, 20, 36, 0.65);
            --text-pure: #f8fafc;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        body { background: var(--bg-deep); color: var(--text-pure); font-family: sans-serif; margin: 0; padding: 12px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 345px; background: var(--card-glass); border-radius: 26px; padding: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(20px); }
        h2 { margin-bottom: 20px; font-size: 20px; background: var(--grad-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; color: white; background: var(--grad-primary); }
        .footer-owner { margin-top: 20px; font-size: 10px; color: var(--text-sub); }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="app-container">
        <h2>Horizon Cooler</h2>
        <button class="btn" id="connBtn" onclick="toggleBLE()">CONNECT BLE</button>
        <div id="status" style="font-size:12px; margin:10px;">Disconnected</div>
        <div class="footer-owner">Developed by <a href="https://t.me/horizontalzzz" style="color:#00f2fe">@horizontalzzz</a></div>
    </div>
    <script>
        // --- PROTEKSI ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if(e.keyCode==123) e.preventDefault(); });
        
        // --- LOGIKA BLE ---
        let device;
        async function toggleBLE() {
            try {
                device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'Horizon Cooler BLE' }], optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e'] });
                const server = await device.gatt.connect();
                document.getElementById('status').innerText = 'Connected!';
            } catch(e) { document.getElementById('status').innerText = 'Failed'; }
        }
    </script>
</body>
</html>
